AWSTemplateFormatVersion: "2010-09-09"
Description: Durable SQS queue and dead-letter monitoring for AskVera knowledge ingestion.

Parameters:
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for dead-letter queue alarms.
    AllowedPattern: "^$|^arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+$"
  MessageRetentionSeconds:
    Type: Number
    Default: 345600
    MinValue: 60
    MaxValue: 1209600
  VisibilityTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 43200
  KnowledgeBucketName:
    Type: String
    Default: ""
    Description: Existing S3 bucket whose approved policy uploads should enter the ingestion worker.

Conditions:
  SendAlarmNotifications: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  EnableS3AutoIngestion: !Not [!Equals [!Ref KnowledgeBucketName, ""]]

Resources:
  IngestionDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      Tags:
        - Key: Application
          Value: AskVera
        - Key: DataClassification
          Value: Internal
        - Key: Purpose
          Value: IngestionDeadLetter

  IngestionQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IngestionDeadLetterQueue.Arn
        maxReceiveCount: 5
      VisibilityTimeout: !Ref VisibilityTimeoutSeconds
      Tags:
        - Key: Application
          Value: AskVera
        - Key: DataClassification
          Value: Internal
        - Key: Purpose
          Value: KnowledgeIngestion

  QueueTransportPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransportToIngestionQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyInsecureTransportToDeadLetterQueue
            Effect: Deny
            Principal: "*"
            Action: sqs:*
            Resource: !GetAtt IngestionDeadLetterQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - !If
            - EnableS3AutoIngestion
            - Sid: AllowApprovedS3Events
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IngestionQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ApprovedPolicyObjectCreatedRule.Arn
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
            - !Ref AWS::NoValue
      Queues:
        - !Ref IngestionQueue
        - !Ref IngestionDeadLetterQueue

  ApprovedPolicyObjectCreatedRule:
    Type: AWS::Events::Rule
    Condition: EnableS3AutoIngestion
    Properties:
      Description: Send approved policy uploads to the AskVera durable ingestion worker.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref KnowledgeBucketName
          object:
            key:
              - prefix: approved/
      State: ENABLED
      Targets:
        - Arn: !GetAtt IngestionQueue.Arn
          Id: IngestionQueue

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: !If
        - SendAlarmNotifications
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      AlarmDescription: AskVera ingestion commands require operator review.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionDeadLetterQueue.QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 300
      Statistic: Maximum
      Threshold: 0
      TreatMissingData: notBreaching

  OldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: !If
        - SendAlarmNotifications
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue
      AlarmDescription: AskVera ingestion processing is delayed.
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IngestionQueue.QueueName
      EvaluationPeriods: 2
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Period: 300
      Statistic: Maximum
      Threshold: 1800
      TreatMissingData: notBreaching

Outputs:
  IngestionQueueArn:
    Value: !GetAtt IngestionQueue.Arn
  IngestionQueueUrl:
    Value: !Ref IngestionQueue
  IngestionDeadLetterQueueArn:
    Value: !GetAtt IngestionDeadLetterQueue.Arn
  IngestionDeadLetterQueueUrl:
    Value: !Ref IngestionDeadLetterQueue
  ApprovedPolicyObjectCreatedRuleArn:
    Condition: EnableS3AutoIngestion
    Value: !GetAtt ApprovedPolicyObjectCreatedRule.Arn
